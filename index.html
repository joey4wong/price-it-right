<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Price It Right</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%23c8f560%22/%3E%3Ctext x=%2232%22 y=%2246%22 font-family=%22Arial,sans-serif%22 font-weight=%22700%22 font-size=%2240%22 text-anchor=%22middle%22 fill=%22%230b0b0c%22%3E$%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css?v=8">
<style>
#play{max-width:520px;margin:0 auto}
.top{display:flex;justify-content:space-between;font:500 13px var(--mono);color:var(--mut);margin:6px 0 10px}
.top span:first-child{color:var(--ink2)}.top span:last-child{color:var(--acc)}
.timer{height:4px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden;margin-bottom:16px}
.timer>div{height:100%;width:100%;background:var(--acc);transition:width .1s linear}
.timer.low>div{background:var(--neg)}
.pic{display:flex;justify-content:center;align-items:center;height:190px;margin:2px 0 8px}.pic img{max-width:80%;max-height:190px;object-fit:contain;filter:drop-shadow(0 12px 18px rgba(0,0,0,.45))}
.name{font:600 22px/1.25 var(--sans);letter-spacing:-.02em;text-align:center}
.desc{text-align:center;color:var(--mut);margin:6px 0 16px;font-size:15px}
.q{text-align:center;font:500 12px var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--mut);margin-bottom:12px}
.opt{display:block;width:100%;font:600 24px var(--mono);letter-spacing:-.03em;background:var(--card2);color:var(--ink);border:1px solid var(--line2);border-radius:12px;padding:15px;margin-bottom:10px;cursor:pointer;transition:transform .1s,border-color .15s}
.opt:active{transform:scale(.985);border-color:var(--acc)}
.opt.right{background:rgba(200,245,96,.10);border-color:var(--acc);color:var(--acc)}
.opt.wrong{background:rgba(255,122,89,.10);border-color:var(--neg);color:var(--neg)}
.opt.dim{opacity:.35}
.fb{text-align:center;font-size:16px}
.why{margin-top:14px;display:flex;flex-direction:column;gap:8px}.why .wq{font:500 12px var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--mut);margin-bottom:2px}
.why button{font:500 15px var(--sans);color:var(--ink);background:transparent;border:1px solid var(--line2);border-radius:10px;padding:12px;cursor:pointer;transition:border-color .15s}.why button.on{border-color:var(--acc);background:rgba(200,245,96,.10)}
.big{font:600 64px var(--mono);color:var(--acc);letter-spacing:-.06em;text-align:center;margin:8px 0 0}
.mid{text-align:center;font-size:15px;color:var(--mut);margin-bottom:16px}
.rw{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.rw:last-child{border:0}
.ok{color:var(--acc);font:500 13px var(--mono)}.no{color:var(--neg);font:500 13px var(--mono)}.tmo{color:var(--gold);font:500 13px var(--mono)}
#board,.nav{display:none}
</style></head><body>
<header class="bar"><div class="in"><div class="brand"><span class="mk">$</span>Price It, Place It</div><div class="gn"><b>Game 1</b> / 5</div></div></header>
<div id="wrap">
<div id="bsteps" style="display:none"></div>
<div class="nav" id="nav"><div class="seg"><button id="tp" class="on">Play</button><button id="tb">Live board</button></div></div>
<div id="play"></div>
<div id="board">
 <div class="bhead"><div><span class="tag"><i></i>Live</span><br><h1 class="logo">Price It Right</h1><p class="sub" style="margin:0">Most correct wins. Ties go to the faster player.</p></div>
 <div class="join"><img id="qr" alt="QR"><div><b>Scan to play</b><span id="url"></span></div></div></div>
 <div class="stats"><div class="pill"><b id="sp">0</b>In room</div><div class="pill"><b id="sf">0</b>Finished</div></div>
 <div class="cols"><div><div id="rows"></div><div class="empty" id="empty"><span class="em">🛍️</span>Waiting for players to join...</div></div>
 <div class="side"><div class="hard"><h3>Most missed questions</h3><div id="hl"><div style="color:var(--mut);font-size:14px">Waiting for answers...</div></div></div><div class="feed"><h3>Live activity</h3><div id="fl"></div></div></div></div>
 <div class="tools"><button id="nextr" style="border-color:rgba(52,211,168,.6)">Next round: Swipe to Shop</button><button id="reset">Reset all rounds</button></div>
</div>
</div>
<script src="shared.js?v=6"></script>
<script>
var ITEMS=[
 {e:"\uD83C\uDF75",img:"q1.png",n:"Norse Nitro Cold Brew Green Tea with Lemon",d:"12-pack of 355 mL cans",o:["$24","$48","$96"],a:1,real:"$47.99"},
 {e:"\uD83D\uDC5C",img:"q2.png",n:"lululemon Everywhere Belt Bag",d:"1 L, regular price",o:["$44","$88","$132"],a:0,real:"$44"},
 {e:"\uD83E\uDD64",img:"q3.png",n:"Stanley Quencher H2.0 Tumbler",d:"40 oz, regular price",o:["$19","$39","$59"],a:2,real:"$59"},
 {e:"\uD83D\uDED2",img:"q4.png",n:"Costco Gold Star Membership",d:"One year",o:["$25","$65","$130"],a:1,real:"$65"},
 {e:"\uD83C\uDFA7",img:"q5.png",n:"Apple AirPods Pro 3",d:"New",o:["$179","$249","$329"],a:2,real:"$329"},
 {e:"\uD83C\uDFAE",img:"q6.png",n:"Nintendo Switch 2",d:"Console only",o:["$679.99","$879.99","$1,079.99"],a:0,real:"$679.99"},
 {e:"\uD83D\uDCF1",img:"q7.png",n:"iPhone Duo",d:"256 GB, Apple's first foldable",o:["$1,999","$2,999","$3,999"],a:1,real:"$2,999"},
 {e:"\uD83E\uDDE5",img:"q8.png",n:"Canada Goose Expedition Parka",d:"Men's",o:["$995","$1,495","$1,995"],a:2,real:"$1,995"}
];
var TOTAL=ITEMS.length,SECS=8,FEEDBACK_MS=1400;
var DB='https://price-it-right-game-default-rtdb.firebaseio.com';
var ROOM=(new URLSearchParams(location.search).get('room')||'class').replace(/[^A-Za-z0-9_-]/g,'').slice(0,30)||'class';
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function pid(){return 'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
var $=function(i){return document.getElementById(i)};
/* ---------- view switching ---------- */
var view='play',pollT=null;
function setView(v){
  view=v;$('play').style.display=v==='play'?'block':'none';$('board').style.display=v==='board'?'block':'none';
  $('tp').className=v==='play'?'on':'';$('tb').className=v==='board'?'on':'';
  $('wrap').style.maxWidth=v==='board'?'1180px':'560px';
  $('bsteps').style.display=v==='board'?'block':'none';$('nav').style.display='none';
  clearInterval(pollT);
  if(v==='board'){tick();pollT=setInterval(tick,1000);history.replaceState(null,'','#board')}else history.replaceState(null,'',location.pathname+location.search);
}
$('tp').onclick=function(){setView('play')};$('tb').onclick=function(){setView('board')};
function navShow(b){$('nav').className='nav'+(b?'':' hide')}
/* ---------- player ---------- */
var app=$('play');
var state={name:"",i:0,score:0,log:[],t0:0,timer:null,locked:false,secs:0};
function sync(done){
  if(!state.pid)return;
  var res=state.log.map(function(l){return l.timeout?'t':l.ok?'c':'w'}).join('');
  try{fetch(DB+'/rooms/'+ROOM+'/'+state.pid+'.json',{method:'PUT',keepalive:true,body:JSON.stringify({name:state.name,score:state.score,secs:Math.round(state.secs*10)/10,q:state.log.length,res:res,why:state.log.map(function(l){return l.why||'-'}).join(''),done:!!done,ts:Date.now()})}).catch(function(){})}catch(e){}
}
function el(h){app.innerHTML=h}
var R1='pir_r1_'+ROOM;
function save(inq){try{localStorage.setItem(R1,JSON.stringify({pid:state.pid,name:state.name,score:state.score,log:state.log,secs:state.secs,inq:!!inq}))}catch(e){}}
function resumeOrStart(){
  var sv=null;try{sv=JSON.parse(localStorage.getItem(R1)||'null')}catch(e){}
  if(!sv||!sv.pid){start();return}
  el('<p class="hint">Loading...</p>');
  fetch(DB+'/rooms/'+ROOM+'/'+sv.pid+'.json',{cache:'no-store'}).then(function(r){return r.json()}).then(function(d){
    if(!d){localStorage.removeItem(R1);start();return}
    state={name:sv.name,i:0,score:sv.score,log:sv.log||[],t0:0,timer:null,locked:false,secs:sv.secs||0,pid:sv.pid};
    if(sv.inq&&state.log.length<TOTAL){state.log.push({n:ITEMS[state.log.length].n,ok:false,timeout:true});state.secs+=SECS;sync(state.log.length>=TOTAL);save(false)}
    state.i=state.log.length;
    if(state.i>=TOTAL)finish();else show();
  }).catch(function(){start()});
}
function start(){
  navShow(true);
  el('<h1 class="logo">Price It Right</h1><p class="sub">'+TOTAL+' products. 3 prices each. '+SECS+' seconds per question. Most correct answers wins; if tied, the faster player wins.</p>'+
  '<div class="card"><input id="nm" placeholder="Your name" maxlength="20" autocomplete="off"><button class="main" id="go">Start</button></div>'+
  '<p class="hint">Tip: tap an answer as soon as you know it.</p>');
  $('go').onclick=function(){
    var v=$('nm').value.trim();
    setName(v||'Player');state={name:v||"Player",i:0,score:0,log:[],t0:0,timer:null,locked:false,secs:0,pid:pid()};
    sync(false);save(false);show();
  };
}
function show(){
  navShow(false);try{window.scrollTo(0,0)}catch(e){}
  var it=ITEMS[state.i];state.locked=false;
  var opts=it.o.map(function(o,k){return '<button class="opt" data-k="'+k+'">'+esc(o)+'</button>'}).join('');
  el('<div class="top"><span>Question '+(state.i+1)+' / '+TOTAL+'</span><span>Correct '+state.score+'</span></div>'+
  '<div class="timer" id="tm"><div id="tbar"></div></div>'+
  '<div class="card"><div class="pic"><img src="'+it.img+'" alt=""></div><div class="name">'+esc(it.n)+'</div><div class="desc">'+esc(it.d)+'</div><div class="q">How much does it cost?</div>'+opts+'<div class="fb" id="fb"></div></div>');
  var btns=app.querySelectorAll('.opt');
  for(var b=0;b<btns.length;b++)btns[b].onclick=(function(k){return function(){answer(k)}})(b);
  state.t0=Date.now();clearInterval(state.timer);save(true);
  state.timer=setInterval(function(){
    var left=Math.max(0,SECS-(Date.now()-state.t0)/1000);
    var tb=$('tbar'),tm=$('tm');
    if(tb)tb.style.width=(left/SECS*100)+'%';
    if(tm)tm.className='timer'+(left<=3?' low':'');
    if(left<=0)answer(-1);
  },100);
}
function answer(k){
  if(state.locked)return;state.locked=true;clearInterval(state.timer);
  var it=ITEMS[state.i];
  var left=Math.max(0,SECS-(Date.now()-state.t0)/1000);
  var ok=(k===it.a);
  state.secs+=(SECS-left);if(ok)state.score++;
  state.log.push({n:it.n,ok:ok,timeout:k<0});
  sync(state.log.length>=TOTAL);save(false);
  var btns=app.querySelectorAll('.opt');
  for(var b=0;b<btns.length;b++){btns[b].onclick=null;btns[b].className='opt '+(b===it.a?'right':b===k?'wrong':'dim')}
  $('fb').innerHTML='';
  var W=[['c','Cost to make it'],['p','Compared with similar products'],['u','What it is worth to me']];
  var wb=document.createElement('div');wb.className='why';wb.innerHTML='<div class="wq">How did you guess?</div>'+W.map(function(w){return '<button data-w="'+w[0]+'">'+w[1]+'</button>'}).join('');
  $('fb').appendChild(wb);try{wb.scrollIntoView({behavior:'smooth',block:'end'})}catch(e){}
  var wbs=wb.querySelectorAll('button');for(var j=0;j<wbs.length;j++)wbs[j].onclick=function(){if(state.wlock)return;state.wlock=true;state.log[state.log.length-1].why=this.getAttribute('data-w');this.className='on';sync(state.log.length>=TOTAL);save(false);setTimeout(function(){state.wlock=false;state.i++;if(state.i<TOTAL)show();else finish()},250)};
}
function finish(){
  navShow(true);
  var rows=state.log.map(function(l){return '<div class="rw"><span>'+esc(l.n)+'</span><span class="'+(l.timeout?'tmo':l.ok?'ok':'no')+'">'+(l.ok?'correct':(l.timeout?'time':'miss'))+'</span></div>'}).join('');
  el('<h1 class="logo">Done, '+esc(state.name)+'!</h1>'+
  '<div class="card"><div class="mid">Your score</div><div class="big">'+state.score+' / '+TOTAL+'</div><div class="mid">Tie-break time: '+state.secs.toFixed(1)+' s (lower wins)</div>'+rows+'</div>'+
  '<p class="hint">Your answers are locked. Thanks for playing!</p>');
}
/* ---------- board ---------- */
var base=location.href.replace(/[?#].*$/,'').replace(/board\.html$/,'').replace(/index\.html$/,'');
var joinUrl=base+(ROOM==='class'?'':'?room='+ROOM);
$('qr').src='https://api.qrserver.com/v1/create-qr-code/?size=300x300&margin=0&data='+encodeURIComponent(joinUrl);
$('url').textContent=joinUrl.replace(/^https?:\/\//,'');
var els={},prev=null,box=$('rows');
function addEv(cls,ic,html,sub){
  var d=document.createElement('div');d.className='ev '+cls;
  d.innerHTML='<span class="ic">'+ic+'</span><div>'+html+(sub?'<em>'+sub+'</em>':'')+'</div>';
  var fl=$('fl');fl.insertBefore(d,fl.firstChild);while(fl.children.length>14)fl.removeChild(fl.lastChild);
}
function events(arr){
  var cur={};arr.forEach(function(d){cur[d._k]=d});
  if(prev){
    arr.forEach(function(d){
      var o=prev[d._k],n=esc(d.name),res=d.res||'';
      var ores='';if(!o)addEv('j','👋','<b>'+n+'</b> joined the room');else ores=o.res||'';
      for(var i=ores.length;i<res.length;i++){
        var it=ITEMS[i]||{e:'',n:''},c=res[i];
        if(c==='c')addEv('c','✅','<b>'+n+'</b> got Q'+(i+1)+' right',it.e+' '+esc(it.n));
        else if(c==='w')addEv('w','❌','<b>'+n+'</b> got Q'+(i+1)+' wrong',it.e+' '+esc(it.n));
        else addEv('t','⏱️','<b>'+n+'</b> ran out of time on Q'+(i+1),it.e+' '+esc(it.n));
      }
      if(d.done&&!(o&&o.done))addEv('j','🏁','<b>'+n+'</b> finished with '+d.score+' / '+TOTAL);
    });
  }
  prev=cur;
}
function hardest(arr){
  var w=[],a=[],i;for(i=0;i<TOTAL;i++){w[i]=0;a[i]=0}
  arr.forEach(function(d){var r=d.res||'';for(i=0;i<r.length&&i<TOTAL;i++){a[i]++;if(r[i]!=='c')w[i]++}});
  var idx=[];for(i=0;i<TOTAL;i++)if(w[i]>0)idx.push(i);
  idx.sort(function(x,y){return (w[y]-w[x])||(w[y]/a[y]-w[x]/a[x])||(x-y)});
  var h=$('hl');
  if(!idx.length){h.innerHTML='<div style="color:var(--mut);font-size:14px">No wrong answers yet</div>';return}
  h.innerHTML=idx.slice(0,3).map(function(q,k){var it=ITEMS[q];return '<div class="hq'+(k===0?' first':'')+'"><div class="t"><b>'+(k+1)+'</b><span class="n">'+it.e+' Q'+(q+1)+' '+esc(it.n)+'</span><span class="c">'+w[q]+' <small>of '+a[q]+' missed</small></span></div><div class="bb"><i style="width:'+Math.round(w[q]/a[q]*100)+'%"></i></div></div>'}).join('');
}
function render(data){
  var arr=[];for(var k in (data||{})){var d=data[k];if(d&&d.name!==undefined){d._k=k;arr.push(d)}}
  arr.sort(function(a,b){return (b.score-a.score)||(a.secs-b.secs)||(a.ts-b.ts)});
  events(arr);hardest(arr);
  $('empty').style.display=arr.length?'none':'block';
  $('sp').textContent=arr.length;$('sf').textContent=arr.filter(function(d){return d.done}).length;
  var seen={};
  arr.forEach(function(d,i){
    seen[d._k]=1;var e=els[d._k];
    if(!e){e=els[d._k]=document.createElement('div');
      e.innerHTML='<div class="rk"></div><div class="nm"></div><div class="dots"></div><div class="sc"></div><div class="tm"></div>';
      var dd='';for(var j=0;j<TOTAL;j++)dd+='<span class="dot"></span>';e.children[2].innerHTML=dd}
    e.className='row'+(i<3?' r'+(i+1):'');
    var medal=i===0?'\uD83E\uDD47':i===1?'\uD83E\uDD48':i===2?'\uD83E\uDD49':null,c=e.children;
    c[0].innerHTML=medal?'<span class="m">'+medal+'</span>':(i+1);
    c[1].textContent=d.name;
    var res=d.res||'',ds=c[2].children;
    for(var j=0;j<TOTAL;j++){
      var ch=res[j],cl='dot',tx='';
      if(ch==='c'){cl+=' c';tx='✓'}else if(ch==='w'){cl+=' w';tx='✕'}else if(ch==='t'){cl+=' t';tx='⏱'}
      else if(j===res.length&&!d.done)cl+=' cur';
      if(ds[j].className!==cl){ds[j].className=cl;ds[j].textContent=tx}
    }
    c[3].innerHTML=d.score+' <small>/ '+TOTAL+'</small>';
    c[4].textContent=Number(d.secs).toFixed(1)+' s';
    if(box.children[i]!==e)box.insertBefore(e,box.children[i]||null);
  });
  for(var k2 in els)if(!seen[k2]){els[k2].remove();delete els[k2]}
}
function tick(){fetch(DB+'/rooms/'+ROOM+'.json').then(function(r){return r.json()}).then(render).catch(function(){})}
$('reset').onclick=resetAll;$('nextr').onclick=function(){goBoard('swipe')};
$("bsteps").innerHTML=stepsHTML("price");
if(location.hash==="#board"||new URLSearchParams(location.search).get('view')==='board')location.replace("dashboard.html"+SEARCH);
if(location.hash==="#board")start();else resumeOrStart();
setView(location.hash==='#board'||new URLSearchParams(location.search).get('view')==='board'?'board':'play');
</script></body></html>
