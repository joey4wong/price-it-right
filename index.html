<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Price It Right</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--teal:#34d3a8;--cyan:#38bdf8;--gold:#fbbf24;--silver:#cbd5e1;--bronze:#f59e6b;--red:#fb7185;--ink:#f1f5f9;--mut:#8b9bb4;--glass:rgba(255,255,255,.06);--line:rgba(255,255,255,.12)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#070b14;color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
body::before,body::after{content:"";position:fixed;z-index:0;width:60vmax;height:60vmax;border-radius:50%;filter:blur(110px);opacity:.35;animation:drift 22s ease-in-out infinite alternate;pointer-events:none}
body::before{background:#0ea5a0;top:-25vmax;left:-15vmax}
body::after{background:#6366f1;bottom:-30vmax;right:-20vmax;animation-delay:-9s}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.15)}}
#wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:20px 24px 48px}
.nav{display:flex;justify-content:center;margin-bottom:14px}
.nav.hide{display:none}
.seg{display:inline-flex;background:var(--glass);border:1px solid var(--line);border-radius:99px;padding:4px;backdrop-filter:blur(12px)}
.seg button{font:600 14px Inter,sans-serif;color:var(--mut);background:none;border:0;padding:9px 20px;border-radius:99px;cursor:pointer}
.seg button.on{background:linear-gradient(100deg,var(--teal),var(--cyan));color:#04241c}
h1.logo{font-family:Sora,Inter,sans-serif;font-weight:800;letter-spacing:-.02em;line-height:1.3;margin:12px 0 6px;padding:0 0 .18em;font-size:40px;display:inline-block;background:linear-gradient(100deg,#fff 5%,var(--teal) 55%,var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--teal);background:rgba(52,211,168,.1);border:1px solid rgba(52,211,168,.3);padding:6px 14px;border-radius:99px}
.tag i{width:8px;height:8px;border-radius:50%;background:var(--teal);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(52,211,168,.7)}70%{box-shadow:0 0 0 10px rgba(52,211,168,0)}100%{box-shadow:0 0 0 0 rgba(52,211,168,0)}}
.sub{color:var(--mut);font-size:17px;line-height:1.45;margin:0 0 20px}
/* player */
#play{max-width:520px;margin:0 auto}
.card{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px);border-radius:24px;padding:22px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
input{width:100%;font:500 20px Inter,sans-serif;color:var(--ink);padding:15px 16px;border:1.5px solid var(--line);border-radius:14px;margin-bottom:14px;outline:none;background:rgba(0,0,0,.25)}
input:focus{border-color:var(--teal)}
button.main{width:100%;font:700 19px Inter,sans-serif;color:#04241c;background:linear-gradient(100deg,var(--teal),var(--cyan));border:0;border-radius:14px;padding:16px;cursor:pointer}
button.main:active{transform:scale(.98)}
.top{display:flex;justify-content:space-between;font-weight:700;color:var(--teal);margin-bottom:10px}
.timer{height:10px;background:rgba(255,255,255,.1);border-radius:6px;overflow:hidden;margin-bottom:16px}
.timer>div{height:100%;width:100%;background:linear-gradient(90deg,var(--teal),var(--cyan));transition:width .1s linear}
.timer.low>div{background:var(--red)}
.emoji{font-size:84px;text-align:center;margin:4px 0}
.name{font:700 23px/1.25 Sora,Inter,sans-serif;text-align:center}
.desc{text-align:center;color:var(--mut);margin:6px 0 14px;font-size:16px}
.q{text-align:center;font-weight:600;margin-bottom:14px;color:var(--teal);font-size:17px}
.opt{display:block;width:100%;font:800 26px Inter,sans-serif;background:rgba(255,255,255,.07);color:var(--ink);border:2px solid var(--line);border-radius:16px;padding:17px;margin-bottom:12px;cursor:pointer;transition:transform .1s}
.opt:active{transform:scale(.98);border-color:var(--teal)}
.opt.right{background:rgba(52,211,168,.22);border-color:var(--teal);color:#b6f5e3}
.opt.wrong{background:rgba(251,113,133,.2);border-color:var(--red);color:#fecdd3}
.opt.dim{opacity:.4}
.fb{text-align:center;font-size:18px;min-height:52px;font-weight:600}
.big{font:800 64px Sora,Inter,sans-serif;color:var(--teal);text-align:center;margin:8px 0 0}
.mid{text-align:center;font-size:18px;color:var(--mut);margin-bottom:16px}
.rw{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.rw:last-child{border:0}
.ok{color:var(--teal);font-weight:700}.no{color:var(--red);font-weight:700}.tmo{color:var(--gold);font-weight:700}
.hint{margin-top:16px;text-align:center;color:var(--mut);font-size:15px}
/* board */
#board{display:none}
.bhead{display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap}
.bhead h1.logo{font-size:64px}
.join{display:flex;align-items:center;gap:16px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px);border-radius:22px;padding:14px 18px}
.join img{width:130px;height:130px;border-radius:12px;background:#fff;padding:7px;display:block}
.join b{display:block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--teal);margin-bottom:6px}
.join span{display:block;font-size:14px;color:var(--mut);max-width:150px;word-break:break-all}
.stats{display:flex;gap:12px;margin:24px 0 14px;flex-wrap:wrap}
.pill{background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:10px 18px;font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:.1em}
.pill b{display:block;font:800 32px Sora,Inter,sans-serif;color:var(--ink);letter-spacing:0}
.cols{display:grid;grid-template-columns:1fr 340px;gap:20px;align-items:start}
#rows{display:flex;flex-direction:column;gap:10px}
.row{display:grid;grid-template-columns:56px minmax(0,1fr) auto 96px 84px;align-items:center;gap:14px;padding:14px 18px;border-radius:18px;background:var(--glass);border:1px solid rgba(255,255,255,.08);animation:in .5s both}
@keyframes in{from{opacity:0;transform:translateY(12px) scale(.98)}}
.rk{font:800 26px Sora,sans-serif;color:var(--mut);text-align:center}.rk .m{font-size:32px}
.nm{font:700 26px Sora,Inter,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dots{display:flex;gap:6px}
.dot{width:24px;height:24px;border-radius:8px;background:rgba(255,255,255,.08);display:grid;place-items:center;font-size:13px;font-weight:800;color:transparent;transition:background .3s}
.dot.c{background:var(--teal);color:#04241c}.dot.w{background:var(--red);color:#4c0519}.dot.t{background:var(--gold);color:#422006}
.dot.cur{background:rgba(56,189,248,.25);box-shadow:0 0 0 2px var(--cyan) inset;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.4}}
.sc{font:800 28px Sora,sans-serif;text-align:right}.sc small{font-size:16px;color:var(--mut);font-weight:600}
.tm{font-size:19px;color:var(--mut);text-align:right;font-variant-numeric:tabular-nums}
.r1{background:linear-gradient(100deg,rgba(251,191,36,.22),rgba(251,191,36,.04));border-color:rgba(251,191,36,.55);box-shadow:0 0 36px rgba(251,191,36,.16)}
.r1 .rk,.r1 .nm{color:var(--gold)}
.r2{background:linear-gradient(100deg,rgba(203,213,225,.15),rgba(203,213,225,.03));border-color:rgba(203,213,225,.35)}
.r3{background:linear-gradient(100deg,rgba(245,158,107,.16),rgba(245,158,107,.03));border-color:rgba(245,158,107,.35)}
.side{position:sticky;top:16px}.side .feed{position:static}
.feed{background:var(--glass);border:1px solid var(--line);border-radius:20px;padding:16px;backdrop-filter:blur(12px);position:sticky;top:16px}
.feed h3{margin:0 0 10px;font:700 13px Inter,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
#fl{display:flex;flex-direction:column;gap:8px;max-height:560px;overflow:hidden}
.ev{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:12px;font-size:15px;background:rgba(255,255,255,.04);animation:in .4s both;border-left:3px solid var(--mut)}
.ev.c{border-color:var(--teal)}.ev.w{border-color:var(--red)}.ev.t{border-color:var(--gold)}.ev.j{border-color:var(--cyan)}
.ev b{font-weight:700}.ev em{font-style:normal;color:var(--mut);font-size:13px;display:block}
.ev .ic{font-size:20px}
.hard{background:var(--glass);border:1px solid var(--line);border-radius:20px;padding:16px;backdrop-filter:blur(12px);margin-bottom:16px}
.hard h3{margin:0 0 10px;font:700 13px Inter,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.hq{padding:10px 0;border-top:1px solid var(--line)}.hq:first-of-type{border-top:0}
.hq .t{display:flex;gap:10px;align-items:center;font-weight:600;font-size:15px;line-height:1.25}
.hq .t b{font:800 18px Sora,sans-serif;width:26px;color:var(--red)}
.hq .t span.n{flex:1;min-width:0}.hq .t span.c{font:800 18px Sora,sans-serif;color:var(--red);white-space:nowrap}.hq .t span.c small{color:var(--mut);font:500 12px Inter,sans-serif}
.hq .bb{height:6px;border-radius:99px;background:rgba(255,255,255,.08);margin:7px 0 0 36px;overflow:hidden}.hq .bb i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--red));border-radius:99px;transition:width .6s}
.hq.first .t b{font-size:22px}
.empty{text-align:center;color:var(--mut);font-size:24px;padding:60px 0}
.empty .em{font-size:60px;display:block;margin-bottom:8px;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px)}}
.tools{margin-top:24px;opacity:.5}.tools:hover{opacity:1}
.tools button{font:inherit;font-size:14px;padding:7px 14px;border-radius:10px;border:1px solid var(--line);background:var(--glass);color:var(--ink);cursor:pointer}
@media(max-width:900px){.cols{grid-template-columns:1fr}.side{position:static}.row{grid-template-columns:40px minmax(0,1fr) 80px;padding:12px}.dots{grid-column:1/-1;order:5}.tm{display:none}.nm{font-size:20px}.bhead h1.logo{font-size:44px}}
</style></head><body>
<div id="wrap">
<div class="nav" id="nav"><div class="seg"><button id="tp" class="on">Play</button><button id="tb">Live board</button></div></div>
<div id="play"></div>
<div id="board">
 <div class="bhead"><div><span class="tag"><i></i>Live</span><br><h1 class="logo">Price It Right</h1><p class="sub" style="margin:0">Most correct wins. Ties go to the faster player.</p></div>
 <div class="join"><img id="qr" alt="QR"><div><b>Scan to play</b><span id="url"></span></div></div></div>
 <div class="stats"><div class="pill"><b id="sp">0</b>In room</div><div class="pill"><b id="sf">0</b>Finished</div></div>
 <div class="cols"><div><div id="rows"></div><div class="empty" id="empty"><span class="em">🛍️</span>Waiting for players to join...</div></div>
 <div class="side"><div class="hard"><h3>Most missed questions</h3><div id="hl"><div style="color:var(--mut);font-size:14px">Waiting for answers...</div></div></div><div class="feed"><h3>Live activity</h3><div id="fl"></div></div></div></div>
 <div class="tools"><button id="reset">Reset board</button></div>
</div>
</div>
<script>
var ITEMS=[
 {e:"\uD83C\uDF75",n:"Norse Nitro Cold Brew Green Tea with Lemon",d:"12-pack of 355 mL cans",o:["$24","$48","$96"],a:1,real:"$47.99"},
 {e:"\uD83D\uDC5C",n:"lululemon Everywhere Belt Bag",d:"1 L, regular price",o:["$44","$88","$132"],a:0,real:"$44"},
 {e:"\uD83E\uDD64",n:"Stanley Quencher H2.0 Tumbler",d:"40 oz, regular price",o:["$19","$39","$59"],a:2,real:"$59"},
 {e:"\uD83D\uDED2",n:"Costco Gold Star Membership",d:"One year",o:["$25","$65","$130"],a:1,real:"$65"},
 {e:"\uD83C\uDFA7",n:"Apple AirPods Pro 3",d:"New",o:["$179","$249","$329"],a:2,real:"$329"},
 {e:"\uD83C\uDFAE",n:"Nintendo Switch 2",d:"Console only",o:["$679.99","$879.99","$1,079.99"],a:0,real:"$679.99"},
 {e:"\uD83D\uDCF1",n:"iPhone 17",d:"256 GB",o:["$899","$1,299","$1,699"],a:1,real:"$1,299"},
 {e:"\uD83E\uDDE5",n:"Canada Goose Expedition Parka",d:"Men's",o:["$995","$1,495","$1,995"],a:2,real:"$1,995"}
];
var TOTAL=ITEMS.length,SECS=8,FEEDBACK_MS=1400;
var DB='https://price-it-right-game-default-rtdb.firebaseio.com';
var ROOM=(new URLSearchParams(location.search).get('room')||'class').replace(/[^A-Za-z0-9_-]/g,'').slice(0,30)||'class';
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function pid(){return 'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
var $=function(i){return document.getElementById(i)};
/* ---------- view switching ---------- */
var view='play',pollT=null;
function setView(v){
  view=v;$('play').style.display=v==='play'?'block':'none';$('board').style.display=v==='board'?'block':'none';
  $('tp').className=v==='play'?'on':'';$('tb').className=v==='board'?'on':'';
  $('wrap').style.maxWidth=v==='board'?'1180px':'560px';
  clearInterval(pollT);
  if(v==='board'){tick();pollT=setInterval(tick,1000);history.replaceState(null,'','#board')}else history.replaceState(null,'',location.pathname+location.search);
}
$('tp').onclick=function(){setView('play')};$('tb').onclick=function(){setView('board')};
function navShow(b){$('nav').className='nav'+(b?'':' hide')}
/* ---------- player ---------- */
var app=$('play');
var state={name:"",i:0,score:0,log:[],t0:0,timer:null,locked:false,secs:0};
function sync(done){
  if(!state.pid)return;
  var res=state.log.map(function(l){return l.timeout?'t':l.ok?'c':'w'}).join('');
  try{fetch(DB+'/rooms/'+ROOM+'/'+state.pid+'.json',{method:'PUT',keepalive:true,body:JSON.stringify({name:state.name,score:state.score,secs:Math.round(state.secs*10)/10,q:state.log.length,res:res,done:!!done,ts:Date.now()})}).catch(function(){})}catch(e){}
}
function el(h){app.innerHTML=h}
function start(){
  navShow(true);
  el('<h1 class="logo">Price It Right</h1><p class="sub">'+TOTAL+' products. 3 prices each. '+SECS+' seconds per question. Most correct answers wins; if tied, the faster player wins.</p>'+
  '<div class="card"><input id="nm" placeholder="Your name" maxlength="20" autocomplete="off"><button class="main" id="go">Start</button></div>'+
  '<p class="hint">Tip: tap an answer as soon as you know it. Tap "Live board" above to watch everyone.</p>');
  $('go').onclick=function(){
    var v=$('nm').value.trim();
    state={name:v||"Player",i:0,score:0,log:[],t0:0,timer:null,locked:false,secs:0,pid:pid()};
    sync(false);show();
  };
}
function show(){
  navShow(false);
  var it=ITEMS[state.i];state.locked=false;
  var opts=it.o.map(function(o,k){return '<button class="opt" data-k="'+k+'">'+esc(o)+'</button>'}).join('');
  el('<div class="top"><span>Question '+(state.i+1)+' / '+TOTAL+'</span><span>Correct '+state.score+'</span></div>'+
  '<div class="timer" id="tm"><div id="tbar"></div></div>'+
  '<div class="card"><div class="emoji">'+it.e+'</div><div class="name">'+esc(it.n)+'</div><div class="desc">'+esc(it.d)+'</div><div class="q">How much does it cost?</div>'+opts+'<div class="fb" id="fb"></div></div>');
  var btns=app.querySelectorAll('.opt');
  for(var b=0;b<btns.length;b++)btns[b].onclick=(function(k){return function(){answer(k)}})(b);
  state.t0=Date.now();clearInterval(state.timer);
  state.timer=setInterval(function(){
    var left=Math.max(0,SECS-(Date.now()-state.t0)/1000);
    var tb=$('tbar'),tm=$('tm');
    if(tb)tb.style.width=(left/SECS*100)+'%';
    if(tm)tm.className='timer'+(left<=3?' low':'');
    if(left<=0)answer(-1);
  },100);
}
function answer(k){
  if(state.locked)return;state.locked=true;clearInterval(state.timer);
  var it=ITEMS[state.i];
  var left=Math.max(0,SECS-(Date.now()-state.t0)/1000);
  var ok=(k===it.a);
  state.secs+=(SECS-left);if(ok)state.score++;
  state.log.push({n:it.n,ok:ok,timeout:k<0});
  sync(state.log.length>=TOTAL);
  var btns=app.querySelectorAll('.opt');
  for(var b=0;b<btns.length;b++){btns[b].onclick=null;btns[b].className='opt '+(b===it.a?'right':b===k?'wrong':'dim')}
  $('fb').innerHTML=ok?('<span class="ok">Correct!</span><br>It costs '+esc(it.real)):('<span class="no">'+(k<0?"Time is up":"Not quite")+'</span><br>It costs '+esc(it.real));
  setTimeout(function(){state.i++;if(state.i<TOTAL)show();else finish()},FEEDBACK_MS);
}
function finish(){
  navShow(true);
  var rows=state.log.map(function(l){return '<div class="rw"><span>'+esc(l.n)+'</span><span class="'+(l.timeout?'tmo':l.ok?'ok':'no')+'">'+(l.ok?'correct':(l.timeout?'time':'miss'))+'</span></div>'}).join('');
  el('<h1 class="logo">Done, '+esc(state.name)+'!</h1>'+
  '<div class="card"><div class="mid">Your score</div><div class="big">'+state.score+' / '+TOTAL+'</div><div class="mid">Tie-break time: '+state.secs.toFixed(1)+' s (lower wins)</div>'+rows+'</div>'+
  '<div style="margin-top:14px"><button class="main" id="seeb">See live board</button></div>'+
  '<div style="margin-top:10px"><button class="main" id="again" style="background:var(--glass);color:var(--ink);border:1px solid var(--line)">Play again</button></div>');
  $('again').onclick=start;$('seeb').onclick=function(){setView('board')};
}
/* ---------- board ---------- */
var base=location.href.replace(/[?#].*$/,'').replace(/board\.html$/,'').replace(/index\.html$/,'');
var joinUrl=base+(ROOM==='class'?'':'?room='+ROOM);
$('qr').src='https://api.qrserver.com/v1/create-qr-code/?size=300x300&margin=0&data='+encodeURIComponent(joinUrl);
$('url').textContent=joinUrl.replace(/^https?:\/\//,'');
var els={},prev=null,box=$('rows');
function addEv(cls,ic,html,sub){
  var d=document.createElement('div');d.className='ev '+cls;
  d.innerHTML='<span class="ic">'+ic+'</span><div>'+html+(sub?'<em>'+sub+'</em>':'')+'</div>';
  var fl=$('fl');fl.insertBefore(d,fl.firstChild);while(fl.children.length>14)fl.removeChild(fl.lastChild);
}
function events(arr){
  var cur={};arr.forEach(function(d){cur[d._k]=d});
  if(prev){
    arr.forEach(function(d){
      var o=prev[d._k],n=esc(d.name),res=d.res||'';
      var ores='';if(!o)addEv('j','👋','<b>'+n+'</b> joined the room');else ores=o.res||'';
      for(var i=ores.length;i<res.length;i++){
        var it=ITEMS[i]||{e:'',n:''},c=res[i];
        if(c==='c')addEv('c','✅','<b>'+n+'</b> got Q'+(i+1)+' right',it.e+' '+esc(it.n));
        else if(c==='w')addEv('w','❌','<b>'+n+'</b> got Q'+(i+1)+' wrong',it.e+' '+esc(it.n));
        else addEv('t','⏱️','<b>'+n+'</b> ran out of time on Q'+(i+1),it.e+' '+esc(it.n));
      }
      if(d.done&&!(o&&o.done))addEv('j','🏁','<b>'+n+'</b> finished with '+d.score+' / '+TOTAL);
    });
  }
  prev=cur;
}
function hardest(arr){
  var w=[],a=[],i;for(i=0;i<TOTAL;i++){w[i]=0;a[i]=0}
  arr.forEach(function(d){var r=d.res||'';for(i=0;i<r.length&&i<TOTAL;i++){a[i]++;if(r[i]!=='c')w[i]++}});
  var idx=[];for(i=0;i<TOTAL;i++)if(w[i]>0)idx.push(i);
  idx.sort(function(x,y){return (w[y]-w[x])||(w[y]/a[y]-w[x]/a[x])||(x-y)});
  var h=$('hl');
  if(!idx.length){h.innerHTML='<div style="color:var(--mut);font-size:14px">No wrong answers yet</div>';return}
  h.innerHTML=idx.slice(0,3).map(function(q,k){var it=ITEMS[q];return '<div class="hq'+(k===0?' first':'')+'"><div class="t"><b>'+(k+1)+'</b><span class="n">'+it.e+' Q'+(q+1)+' '+esc(it.n)+'</span><span class="c">'+w[q]+' <small>of '+a[q]+' missed</small></span></div><div class="bb"><i style="width:'+Math.round(w[q]/a[q]*100)+'%"></i></div></div>'}).join('');
}
function render(data){
  var arr=[];for(var k in (data||{})){var d=data[k];if(d&&d.name!==undefined){d._k=k;arr.push(d)}}
  arr.sort(function(a,b){return (b.score-a.score)||(a.secs-b.secs)||(a.ts-b.ts)});
  events(arr);hardest(arr);
  $('empty').style.display=arr.length?'none':'block';
  $('sp').textContent=arr.length;$('sf').textContent=arr.filter(function(d){return d.done}).length;
  var seen={};
  arr.forEach(function(d,i){
    seen[d._k]=1;var e=els[d._k];
    if(!e){e=els[d._k]=document.createElement('div');
      e.innerHTML='<div class="rk"></div><div class="nm"></div><div class="dots"></div><div class="sc"></div><div class="tm"></div>';
      var dd='';for(var j=0;j<TOTAL;j++)dd+='<span class="dot"></span>';e.children[2].innerHTML=dd}
    e.className='row'+(i<3?' r'+(i+1):'');
    var medal=i===0?'\uD83E\uDD47':i===1?'\uD83E\uDD48':i===2?'\uD83E\uDD49':null,c=e.children;
    c[0].innerHTML=medal?'<span class="m">'+medal+'</span>':(i+1);
    c[1].textContent=d.name;
    var res=d.res||'',ds=c[2].children;
    for(var j=0;j<TOTAL;j++){
      var ch=res[j],cl='dot',tx='';
      if(ch==='c'){cl+=' c';tx='✓'}else if(ch==='w'){cl+=' w';tx='✕'}else if(ch==='t'){cl+=' t';tx='⏱'}
      else if(j===res.length&&!d.done)cl+=' cur';
      if(ds[j].className!==cl){ds[j].className=cl;ds[j].textContent=tx}
    }
    c[3].innerHTML=d.score+' <small>/ '+TOTAL+'</small>';
    c[4].textContent=Number(d.secs).toFixed(1)+' s';
    if(box.children[i]!==e)box.insertBefore(e,box.children[i]||null);
  });
  for(var k2 in els)if(!seen[k2]){els[k2].remove();delete els[k2]}
}
function tick(){fetch(DB+'/rooms/'+ROOM+'.json').then(function(r){return r.json()}).then(render).catch(function(){})}
$('reset').onclick=function(){if(confirm('Clear all players from the board?'))fetch(DB+'/rooms/'+ROOM+'.json',{method:'DELETE'}).then(function(){prev=null;$('fl').innerHTML='';tick()})};
start();
setView(location.hash==='#board'||new URLSearchParams(location.search).get('view')==='board'?'board':'play');
</script></body></html>
