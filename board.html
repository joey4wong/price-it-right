<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Price It Right - Leaderboard</title>
<style>
:root{--teal:#34d3a8;--cyan:#38bdf8;--gold:#fbbf24;--silver:#cbd5e1;--bronze:#f59e6b;--ink:#f1f5f9;--mut:#8b9bb4}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#070b14;color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Helvetica,Arial,sans-serif}
body::before,body::after{content:"";position:fixed;z-index:0;width:60vmax;height:60vmax;border-radius:50%;filter:blur(110px);opacity:.35;animation:drift 22s ease-in-out infinite alternate}
body::before{background:#0ea5a0;top:-25vmax;left:-15vmax}
body::after{background:#6366f1;bottom:-30vmax;right:-20vmax;animation-delay:-9s}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.15)}}
#wrap{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:36px 32px 48px}
.head{display:flex;justify-content:space-between;align-items:center;gap:28px;flex-wrap:wrap}
.live{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--teal);background:rgba(52,211,168,.1);border:1px solid rgba(52,211,168,.3);padding:6px 14px;border-radius:99px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--teal);box-shadow:0 0 0 0 rgba(52,211,168,.7);animation:pulse 1.6s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 10px rgba(52,211,168,0)}100%{box-shadow:0 0 0 0 rgba(52,211,168,0)}}
h1{font-size:68px;line-height:1.02;margin:16px 0 8px;font-weight:900;letter-spacing:-.03em;background:linear-gradient(100deg,#fff 10%,var(--teal) 55%,var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mut);font-size:20px;max-width:560px}
.join{display:flex;align-items:center;gap:18px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(14px);border-radius:24px;padding:16px 20px;box-shadow:0 20px 50px rgba(0,0,0,.4)}
.join img{width:140px;height:140px;border-radius:14px;background:#fff;padding:8px;display:block}
.join b{display:block;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--teal);margin-bottom:6px}
.join span{display:block;font-size:14px;color:var(--mut);max-width:150px;word-break:break-all}
.stats{display:flex;gap:14px;margin:34px 0 14px;flex-wrap:wrap}
.pill{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:12px 20px;font-size:14px;color:var(--mut);text-transform:uppercase;letter-spacing:.1em}
.pill b{display:block;font-size:34px;color:var(--ink);letter-spacing:0;line-height:1.1}
#rows{display:flex;flex-direction:column;gap:12px}
.row{display:grid;grid-template-columns:76px 1.4fr 1.6fr 120px 110px;align-items:center;gap:16px;padding:16px 22px;border-radius:20px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);backdrop-filter:blur(10px);animation:in .5s both;transition:background .4s,border-color .4s}
@keyframes in{from{opacity:0;transform:translateY(14px) scale(.98)}}
.rk{font-size:30px;font-weight:900;color:var(--mut);text-align:center}
.nm{font-size:30px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pg{display:flex;align-items:center;gap:12px}
.bar{flex:1;height:12px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--teal),var(--cyan));transition:width .8s cubic-bezier(.2,.8,.2,1)}
.fin{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#052e22;background:var(--teal);padding:4px 10px;border-radius:99px}
.sc{font-size:32px;font-weight:900;text-align:right}.sc small{font-size:18px;color:var(--mut);font-weight:600}
.tm{font-size:22px;color:var(--mut);text-align:right;font-variant-numeric:tabular-nums}
.r1{background:linear-gradient(100deg,rgba(251,191,36,.22),rgba(251,191,36,.04));border-color:rgba(251,191,36,.55);box-shadow:0 0 40px rgba(251,191,36,.18)}
.r1 .rk,.r1 .nm{color:var(--gold)}.r1 .nm{font-size:36px}
.r2{background:linear-gradient(100deg,rgba(203,213,225,.15),rgba(203,213,225,.03));border-color:rgba(203,213,225,.35)}
.r3{background:linear-gradient(100deg,rgba(245,158,107,.16),rgba(245,158,107,.03));border-color:rgba(245,158,107,.35)}
.rk .m{font-size:38px}
.empty{text-align:center;color:var(--mut);font-size:26px;padding:70px 0}
.empty .em{font-size:64px;display:block;margin-bottom:10px;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px)}}
.tools{margin-top:28px;font-size:14px;color:var(--mut);display:flex;align-items:center;gap:14px;opacity:.55;transition:opacity .2s}
.tools:hover{opacity:1}
.tools button{font:inherit;padding:7px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:var(--ink);cursor:pointer}
.tools button:hover{background:rgba(255,255,255,.14)}
@media(max-width:760px){h1{font-size:44px}.row{grid-template-columns:48px 1fr 90px;padding:14px}.pg,.tm{display:none}.nm{font-size:22px}.sc{font-size:24px}}
</style></head><body><div id="wrap">
<div class="head"><div><span class="live"><i></i>Live</span><h1>Price It Right</h1><div class="sub" id="sub">Most correct wins. Ties go to the faster player.</div></div>
<div class="join"><img id="qr" alt="QR"><div><b>Scan to play</b><span id="url"></span></div></div></div>
<div class="stats"><div class="pill"><b id="sp">0</b>Players</div><div class="pill"><b id="sf">0</b>Finished</div></div>
<div id="rows"></div>
<div class="empty" id="empty"><span class="em">🛍️</span>Waiting for players to join...</div>
<div class="tools"><button id="reset">Reset board</button></div>
</div>
<script>
var DB='https://price-it-right-game-default-rtdb.firebaseio.com';
var ROOM=(new URLSearchParams(location.search).get('room')||'class').replace(/[^A-Za-z0-9_-]/g,'').slice(0,30)||'class';
var TOTAL=8;
var base=location.href.replace(/board\.html.*$/,'');
var joinUrl=base+(ROOM==='class'?'':'?room='+ROOM);
document.getElementById('qr').src='https://api.qrserver.com/v1/create-qr-code/?size=300x300&margin=0&data='+encodeURIComponent(joinUrl);
document.getElementById('url').textContent=joinUrl.replace(/^https?:\/\//,'');
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')}
var els={},box=document.getElementById('rows');
function render(data){
  var arr=[];for(var k in (data||{})){var d=data[k];if(d&&d.name!==undefined){d._k=k;arr.push(d)}}
  arr.sort(function(a,b){return (b.score-a.score)||(a.secs-b.secs)||(a.ts-b.ts)});
  document.getElementById('empty').style.display=arr.length?'none':'block';
  document.getElementById('sp').textContent=arr.length;
  document.getElementById('sf').textContent=arr.filter(function(d){return d.done}).length;
  var seen={};
  arr.forEach(function(d,i){
    seen[d._k]=1;var e=els[d._k];
    if(!e){e=els[d._k]=document.createElement('div');
      e.innerHTML='<div class="rk"></div><div class="nm"></div><div class="pg"><div class="bar"><i></i></div><span class="fin" hidden>Done</span></div><div class="sc"></div><div class="tm"></div>';}
    var medal=i===0?'\uD83E\uDD47':i===1?'\uD83E\uDD48':i===2?'\uD83E\uDD49':null;
    e.className='row'+(i<3?' r'+(i+1):'');
    var c=e.children;
    c[0].innerHTML=medal?'<span class="m">'+medal+'</span>':(i+1);
    c[1].innerHTML=esc(d.name);
    c[2].querySelector('i').style.width=Math.min(100,d.q/TOTAL*100)+'%';
    c[2].querySelector('.fin').hidden=!d.done;
    c[3].innerHTML=d.score+' <small>/ '+TOTAL+'</small>';
    c[4].textContent=Number(d.secs).toFixed(1)+' s';
    if(box.children[i]!==e)box.insertBefore(e,box.children[i]||null);
  });
  for(var k in els)if(!seen[k]){els[k].remove();delete els[k]}
}
function tick(){
  fetch(DB+'/rooms/'+ROOM+'.json').then(function(r){return r.json()}).then(render).catch(function(){});
}
setInterval(tick,1000);tick();
document.getElementById('reset').onclick=function(){
  if(confirm('Clear all players from the board?'))fetch(DB+'/rooms/'+ROOM+'.json',{method:'DELETE'}).then(tick);
};
</script></body></html>
