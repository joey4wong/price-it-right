<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Swipe to Shop - Game 4</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%23c8f560%22/%3E%3Ctext x=%2232%22 y=%2246%22 font-family=%22Arial,sans-serif%22 font-weight=%22700%22 font-size=%2240%22 text-anchor=%22middle%22 fill=%22%230b0b0c%22%3E$%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css?v=8">
<style>
.prog{display:flex;gap:5px;margin:6px 0 14px}.prog i{flex:1;height:4px;border-radius:9px;background:rgba(255,255,255,.12);transition:background .3s}.prog i.on{background:var(--acc)}
.deck{position:relative;height:500px;touch-action:pan-y}
.sc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;user-select:none;-webkit-user-select:none;transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .35s}
.sc .pic{height:200px;display:flex;align-items:center;justify-content:center;margin-bottom:12px}
.sc .pic,.sc .pic *{pointer-events:none;-webkit-user-drag:none}
.sc .pic img{max-height:200px;max-width:85%;filter:drop-shadow(0 12px 18px rgba(0,0,0,.45))}
.sc .nm{font:600 22px/1.25 var(--sans);letter-spacing:-.02em}
.sc .ds{color:var(--mut);margin:4px 0 14px;font-size:15px}
.price{font:600 46px var(--mono);letter-spacing:-.05em}
.price s{font-size:26px;color:var(--dim);font-weight:500;margin-right:10px;text-decoration-thickness:2px;text-decoration-color:var(--neg)}
.sale{display:inline-block;margin-top:8px;font:600 12px var(--mono);letter-spacing:.06em;color:#0b0b0c;background:var(--neg);padding:4px 10px;border-radius:6px}
.stamp{position:absolute;top:22px;font:700 20px var(--mono);letter-spacing:.04em;padding:4px 12px;border:2px solid;border-radius:8px;opacity:0}
.stamp.buy{left:20px;color:var(--acc);transform:rotate(-10deg)}.stamp.pass{right:20px;color:var(--neg);transform:rotate(10deg)}
.btns{display:flex;gap:12px;margin-top:16px}
.btns button{flex:1;font:600 17px var(--sans);padding:16px 10px;border-radius:12px;cursor:pointer;border:1px solid;background:transparent}
.bpass{border-color:rgba(255,122,89,.5)!important;color:var(--neg);background:rgba(255,122,89,.06)}
.bbuy{border-color:rgba(200,245,96,.5)!important;color:var(--acc);background:rgba(200,245,96,.08)}
.menu{width:100%;display:flex;flex-direction:column;gap:10px;margin-top:6px}
.menu button{display:flex;justify-content:space-between;align-items:center;width:100%;font:500 18px var(--sans);color:var(--ink);background:var(--card2);border:1px solid var(--line2);border-radius:12px;padding:14px 18px;cursor:pointer;transition:border-color .15s}
.menu button span{font:600 19px var(--mono);letter-spacing:-.02em}
.menu button.none{justify-content:center;color:var(--mut);font-weight:500;font-size:15px;padding:11px;background:transparent}
.q{color:var(--mut);font:500 12px var(--mono);letter-spacing:.04em;text-transform:uppercase;margin-bottom:6px}
</style></head><body>
<header class="bar"><div class="in"><div class="brand"><span class="mk">$</span>Price It, Place It</div><div class="gn"><b>Game 4</b> / 5</div></div></header><div id="wrap"></div>
<script src="shared.js?v=6"></script>
<script>
var BOARD=location.hash==='#board';
var SWP=ROOM+'__swipe';
var CARDS=[
 {k:'ld',img:'sw_mug.png',ph:'Insulated tumbler',nm:'Insulated tumbler',ds:'Stainless steel, double-wall, with lid',pr:function(g){return g?'$40.00':'$39.99'}},
 {k:'f1',img:'q1.png',nm:'Norse Nitro Green Tea',ds:'12-pack of 355 mL cans',pr:function(){return '$47.99'}},
 {k:'ref',img:'hk_earbuds.png',nm:'Wireless earbuds',ds:'Noise cancelling, 30-hour battery',pr:function(g){return g?'<s>$59.99</s>$44.99<br><span class="sale">SALE</span>':'$44.99'}},
 {k:'f2',img:'q2.png',nm:'lululemon Everywhere Belt Bag',ds:'1 L',pr:function(){return '$44'}},
 {k:'cmp',menu:1,img:'sw_tea.png',ph:'Bubble tea',nm:'Bubble tea',ds:'Which size would you buy?'},
 {k:'f3',img:'q4.png',nm:'Costco Gold Star Membership',ds:'One year',pr:function(){return '$65'}}
];
var wrap=$('wrap');
if(BOARD)location.replace("dashboard.html"+SEARCH);else player();

/* ---------------- player ---------------- */
function player(){
  var st=JSON.parse(localStorage.getItem('pir_sw4_'+ROOM)||'null');
  if(st&&st.pid){api(SWP+'/'+st.pid).then(function(d){if(d)resume(st);else{localStorage.removeItem('pir_sw4_'+ROOM);player()}}).catch(function(){resume(st)});return}
  var n=myName();
  wrap.innerHTML='<span class="kicker"><i></i>Game 4</span><br><h1 class="logo">Swipe to Shop</h1>'+
   '<p class="sub">You are shopping. For each item, would you buy it at this price? Swipe right to buy, left to pass. No right or wrong answers.</p>'+
   '<div class="card"><input id="nm" placeholder="Your name" maxlength="20" autocomplete="off" value=""><button class="main" id="go">Start shopping</button></div>';
  $('go').onclick=function(){
    var v=$('nm').value.trim()||'Player';setName(v);$('go').disabled=true;
    api(SWP).then(function(d){
      var idx=d?Object.keys(d).length:0;
      var g={ld:Math.random()<.5?1:0,ref:Math.random()<.5?1:0,cmp:Math.random()<.5?1:0};
      var s={pid:pid(),name:v,g:g,a:{},i:0};
      localStorage.setItem('pir_sw4_'+ROOM,JSON.stringify(s));
      return api(SWP+'/'+s.pid,'PUT',rec({name:v,g:g,a:{}})).then(function(){resume(s)});
    }).catch(function(){$('go').disabled=false});
  };
}
function save(s){localStorage.setItem('pir_sw4_'+ROOM,JSON.stringify(s))}
function resume(s){
  if(s.i>=CARDS.length){thanks();return}
  var c=CARDS[s.i],g=s.g[c.k]||0,html;
  var pic=c.img?'<img src="'+c.img+'" alt="" draggable="false">':phImg(c.ph,180);
  if(c.menu){
    var opts=[['small','Small','$4.99'],['medium','Medium','$5.99']];
    if(g)opts.push(['large','Large','$6.99']);
    html='<div class="sc"><div class="pic" style="height:'+(c.img?190:140)+'px">'+(c.img?'<img src="'+c.img+'" alt="" draggable="false" style="max-height:185px">':phImg(c.ph,130))+'</div><div class="nm">'+c.nm+'</div><div class="ds">'+c.ds+'</div><div class="menu">'+
      opts.map(function(o){return '<button data-v="'+o[0]+'">'+o[1]+'<span>'+o[2]+'</span></button>'}).join('')+'<button class="none" data-v="none">None of these</button></div></div>';
  }else{
    html='<div class="sc" id="sc"><div class="stamp buy" id="sb">BUY</div><div class="stamp pass" id="sp">PASS</div><div class="pic">'+pic+'</div><div class="nm">'+c.nm+'</div><div class="ds">'+c.ds+'</div><div class="price">'+c.pr(g)+'</div></div>';
  }
  var bars='';for(var i=0;i<CARDS.length;i++)bars+='<i class="'+(i<s.i?'on':'')+'"></i>';
  wrap.innerHTML='<div class="prog">'+bars+'</div><div class="card"><div class="deck fade" id="deck">'+html+'</div>'+
    (c.menu?'':'<div class="btns"><button class="bpass" id="bp">Pass</button><button class="bbuy" id="bb">Buy</button></div>')+'</div>'+
    '<p class="hint">'+(c.menu?'Tap one option.':'Swipe right to buy, left to pass.')+'</p>';
  var locked=false;
  function answer(v){
    if(locked)return;locked=true;
    s.a[c.k]=v;s.i++;var done=s.i>=CARDS.length;save(s);
    var p={};p['a/'+c.k]=v;p.q=s.i;p.done=done;
    api(SWP+'/'+s.pid,'PATCH',p).catch(function(){});
    setTimeout(function(){resume(s)},c.menu?150:330);
  }
  if(c.menu){var bs=wrap.querySelectorAll('.menu button');for(var b=0;b<bs.length;b++)bs[b].onclick=function(){this.style.borderColor='#c8f560';answer(this.getAttribute('data-v'))};return}
  var sc=$('sc'),x0=null,dx=0;
  function fly(dir){sc.style.transform='translateX('+(dir*600)+'px) rotate('+(dir*25)+'deg)';sc.style.opacity=0;answer(dir>0?1:0)}
  $('bb').onclick=function(){fly(1)};$('bp').onclick=function(){fly(-1)};
  sc.addEventListener('pointerdown',function(e){x0=e.clientX;dx=0;sc.style.transition='none';sc.setPointerCapture(e.pointerId)});
  sc.addEventListener('pointermove',function(e){if(x0===null)return;dx=e.clientX-x0;sc.style.transform='translateX('+dx+'px) rotate('+(dx/18)+'deg)';$('sb').style.opacity=Math.max(0,dx/100);$('sp').style.opacity=Math.max(0,-dx/100)});
  sc.addEventListener('pointercancel',function(){x0=null;sc.style.transition='';sc.style.transform=''});
  sc.addEventListener('pointerup',function(){if(x0===null)return;x0=null;sc.style.transition='';if(Math.abs(dx)>90)fly(dx>0?1:-1);else{sc.style.transform='';$('sb').style.opacity=0;$('sp').style.opacity=0}});
}
function thanks(){
  wrap.innerHTML='<div class="card center fade" style="margin-top:40px"><div style="font-size:64px">🛍️</div><h1 class="logo">All done!</h1><p class="sub">Thanks for shopping. Look at the big screen.</p></div>';
}

</script></body></html>
