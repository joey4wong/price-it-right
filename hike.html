<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Price Hike - Game 2</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%23c8f560%22/%3E%3Ctext x=%2232%22 y=%2246%22 font-family=%22Arial,sans-serif%22 font-weight=%22700%22 font-size=%2240%22 text-anchor=%22middle%22 fill=%22%230b0b0c%22%3E$%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css?v=8">
<style>
.prog{display:flex;gap:5px;margin:6px 0 14px}.prog i{flex:1;height:4px;border-radius:9px;background:rgba(255,255,255,.12);transition:background .3s}.prog i.on{background:var(--acc)}
.deck{position:relative;height:470px;touch-action:pan-y}
.sc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;user-select:none;-webkit-user-select:none;transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .35s}
.sc .pic{height:190px;display:flex;align-items:center;justify-content:center;margin-bottom:12px;width:100%}
.sc .pic,.sc .pic *{pointer-events:none}
.nm{font:600 22px/1.25 var(--sans);letter-spacing:-.02em}
.old{margin-top:12px;font:500 20px var(--mono);color:var(--dim);text-decoration:line-through;text-decoration-color:var(--dim)}
.new{font:600 46px var(--mono);letter-spacing:-.05em;color:var(--gold)}
.tag{display:inline-block;margin-top:8px;font:500 12px var(--mono);letter-spacing:.04em;color:var(--gold);border:1px solid rgba(245,196,81,.5);padding:4px 10px;border-radius:6px}
.stamp{position:absolute;top:22px;font:700 20px var(--mono);letter-spacing:.04em;padding:4px 12px;border:2px solid;border-radius:8px;opacity:0}
.stamp.buy{left:20px;color:var(--acc);transform:rotate(-10deg)}.stamp.pass{right:20px;color:var(--neg);transform:rotate(10deg)}
.btns{display:flex;gap:12px;margin-top:16px}
.btns button{flex:1;font:600 17px var(--sans);padding:16px 10px;border-radius:12px;cursor:pointer;border:1px solid;background:transparent}
.bpass{border-color:rgba(255,122,89,.5)!important;color:var(--neg);background:rgba(255,122,89,.06)}
.bbuy{border-color:rgba(200,245,96,.5)!important;color:var(--acc);background:rgba(200,245,96,.08)}
</style></head><body>
<header class="bar"><div class="in"><div class="brand"><span class="mk">$</span>Price It, Place It</div><div class="gn"><b>Game 2</b> / 5</div></div></header><div id="wrap"></div>
<script src="shared.js?v=7"></script>
<script>
if(location.hash==='#board')location.replace('dashboard.html'+SEARCH);
var COL=ROOM+'__hike',KEY='pir_hk_'+ROOM;
var CARDS=[
 {k:'coffee',img:'hk_coffee.png',nm:'Your usual coffee',ph:'Your usual coffee',o:'$2.50',n:'$3.00'},
 {k:'water',img:'hk_water.png',nm:'Any brand of bottled water',ph:'Bottled water',o:'$1.99',n:'$2.39'},
 {k:'laptop',img:'hk_laptop.png',nm:'A new laptop',ph:'Laptop',o:'$1,500',n:'$1,800'},
 {k:'salt',img:'hk_salt.png',nm:'Table salt',ph:'Table salt',o:'$2.00',n:'$2.40'},
 {k:'earbuds',img:'hk_earbuds.png',nm:'Wireless earbuds (online)',ph:'Wireless earbuds',o:'$60',n:'$72'},
 {k:'movie',img:'hk_movie.png',nm:'A movie ticket',ph:'Movie ticket',o:'$15',n:'$18'}
];
var wrap=$('wrap'),st=once(KEY);
function save(){localStorage.setItem(KEY,JSON.stringify(st))}
function boot(){
  if(st&&st.pid){api(COL+'/'+st.pid).then(function(d){if(d)resume();else{localStorage.removeItem(KEY);st=null;intro()}}).catch(resume);return}
  intro();
}
function intro(){
  wrap.innerHTML='<span class="kicker"><i></i>Game 2</span><br><h1 class="logo">Price Hike</h1>'+
   '<p class="sub">Six things you might buy. Each one just got <b style="color:#f5c451">20% more expensive</b>. Would you still buy it? Swipe right to keep buying, left to walk away. Be honest.</p>'+
   '<div class="card"><input id="nm" placeholder="Your name" maxlength="20" autocomplete="off"><button class="main" id="go">Start</button></div>';
  $('go').onclick=function(){var v=$('nm').value.trim()||'Player';this.disabled=true;
    st={pid:pid(),name:v,a:{},i:0};
    api(COL+'/'+st.pid,'PUT',rec({name:v,a:{}})).then(function(){save();resume()}).catch(function(){$('go').disabled=false})};
}
function resume(){
  if(st.i>=CARDS.length){wrap.innerHTML='<div class="card center fade" style="margin-top:40px"><h1 class="logo">All done!</h1><p class="sub">Thanks. Look at the big screen.</p></div>';return}
  var c=CARDS[st.i],bars='';for(var i=0;i<CARDS.length;i++)bars+='<i class="'+(i<st.i?'on':'')+'"></i>';
  wrap.innerHTML='<div class="prog">'+bars+'</div><div class="card"><div class="deck fade"><div class="sc" id="sc"><div class="stamp buy" id="sb">STILL BUY</div><div class="stamp pass" id="sp">WALK AWAY</div>'+
   '<div class="pic">'+pic(c,180)+'</div><div class="nm">'+esc(c.nm)+'</div><div class="old">'+c.o+'</div><div class="new">'+c.n+'</div><span class="tag">+20%</span></div></div>'+
   '<div class="btns"><button class="bpass" id="bp">Walk away</button><button class="bbuy" id="bb">Still buy</button></div></div><p class="hint">Swipe right to keep buying, left to walk away.</p>';
  var sc=$('sc'),x0=null,dx=0,lock=false;
  function answer(v){if(lock)return;lock=true;st.a[c.k]=v;st.i++;save();var p={};p['a/'+c.k]=v;p.q=st.i;p.done=st.i>=CARDS.length;api(COL+'/'+st.pid,'PATCH',p).catch(function(){});setTimeout(resume,330)}
  function fly(d){sc.style.transform='translateX('+(d*600)+'px) rotate('+(d*25)+'deg)';sc.style.opacity=0;answer(d>0?1:0)}
  $('bb').onclick=function(){fly(1)};$('bp').onclick=function(){fly(-1)};
  sc.addEventListener('pointerdown',function(e){x0=e.clientX;dx=0;sc.style.transition='none';sc.setPointerCapture(e.pointerId)});
  sc.addEventListener('pointermove',function(e){if(x0===null)return;dx=e.clientX-x0;sc.style.transform='translateX('+dx+'px) rotate('+(dx/18)+'deg)';$('sb').style.opacity=Math.max(0,dx/100);$('sp').style.opacity=Math.max(0,-dx/100)});
  sc.addEventListener('pointercancel',function(){x0=null;sc.style.transition='';sc.style.transform=''});
  sc.addEventListener('pointerup',function(){if(x0===null)return;x0=null;sc.style.transition='';if(Math.abs(dx)>90)fly(dx>0?1:-1);else{sc.style.transform='';$('sb').style.opacity=0;$('sp').style.opacity=0}});
}
boot();
</script></body></html>
